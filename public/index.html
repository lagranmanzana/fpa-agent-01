<!doctype html>
<html lang="es" class="h-full">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>BCEcopilot · Panel de Ventas</title>
  <meta name="description" content="Panel de ventas con KPIs, serie temporal y análisis asistido por IA" />
  <meta name="theme-color" content="#111827" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Flatpickr (date-range picker) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Markdown renderer (for respuestas del analista) -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <!-- Fuentes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    :root { color-scheme: light dark; }
    html, body { height: 100%; }
    body { font-family: 'Inter', system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, 'Helvetica Neue', Arial; }
    /* Glass / cards */
    .glass { backdrop-filter: blur(10px); background: linear-gradient(180deg, rgba(255,255,255,.65), rgba(255,255,255,.35)); }
    .dark .glass { background: linear-gradient(180deg, rgba(15,23,42,.65), rgba(15,23,42,.35)); }
    .card { @apply glass rounded-2xl border border-white/40 dark:border-white/10 shadow-lg p-5; }
    .kpi-title { @apply text-sm text-slate-600 dark:text-slate-300; }
    .kpi-value { @apply text-3xl md:text-4xl font-semibold text-slate-900 dark:text-white tracking-tight; }
    .btn { @apply inline-flex items-center gap-2 px-4 py-2 rounded-xl bg-slate-900 text-white hover:bg-slate-700 transition disabled:opacity-60; }
    .btn-secondary { @apply inline-flex items-center gap-2 px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-700 text-slate-800 dark:text-slate-200 hover:bg-slate-50/50 dark:hover:bg-white/5 transition; }
    .btn-ghost { @apply inline-flex items-center gap-2 px-3 py-2 rounded-xl text-slate-600 dark:text-slate-300 hover:bg-slate-100/60 dark:hover:bg-white/5 transition; }
    .input { @apply px-4 py-3 rounded-xl border border-slate-300 dark:border-slate-700 bg-white/70 dark:bg-slate-900/60 text-slate-900 dark:text-slate-100 placeholder:text-slate-400 dark:placeholder:text-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500; }
    .pill { @apply rounded-full px-3 py-1 text-xs font-semibold bg-indigo-50 text-indigo-700 dark:bg-indigo-900/40 dark:text-indigo-200 border border-indigo-100 dark:border-indigo-900/50; }
    .skeleton { background: linear-gradient(90deg, rgba(148,163,184,.2), rgba(148,163,184,.35), rgba(148,163,184,.2)); background-size: 200% 100%; animation: shine 1.2s infinite linear; border-radius: .75rem; }
    @keyframes shine { from { background-position: 200% 0; } to { background-position: -200% 0; } }
    /* Markdown (respuesta del analista) */
    .prose-md p { @apply my-2; }
    .prose-md h1, .prose-md h2, .prose-md h3 { @apply font-semibold mt-4 mb-2; }
    .prose-md code { @apply rounded bg-slate-800/90 text-slate-100 px-1 py-0.5 text-[0.85em]; }
    .prose-md pre { @apply overflow-auto rounded-xl p-3 bg-slate-900 text-slate-100 text-sm; }
    .prose-md ul { @apply list-disc pl-6 my-2; }
  </style>
</head>
<body class="bg-gradient-to-br from-indigo-50 via-slate-50 to-slate-100 dark:from-slate-900 dark:via-slate-950 dark:to-slate-900">
  <div class="max-w-7xl mx-auto px-4 md:px-6 py-6 md:py-10 space-y-6">

    <!-- HEADER -->
    <header class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
      <div class="flex items-center gap-3">
        <div class="h-10 w-10 rounded-2xl bg-gradient-to-br from-indigo-500 to-fuchsia-500 shadow-lg"></div>
        <div>
          <h1 class="text-2xl md:text-3xl font-bold tracking-tight text-slate-900 dark:text-white">BCEcopilot</h1>
          <p class="text-slate-600 dark:text-slate-300 text-sm">Resumen de ventas — OrdersTable</p>
        </div>
      </div>

      <div class="flex flex-col md:flex-row md:items-center gap-3 w-full md:w-auto">
        <div class="flex items-center gap-2 w-full md:w-auto">
          <div class="relative">
            <input id="dateRange" class="input w-full md:w-[260px] pr-11" placeholder="Selecciona fecha…" aria-label="Rango de fechas" />
            <svg class="pointer-events-none absolute right-3 top-3.5 h-5 w-5 text-slate-400" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M7 2a1 1 0 011 1v1h8V3a1 1 0 112 0v1h1a2 2 0 012 2v3H4V6a2 2 0 012-2h1V3a1 1 0 011-1zM4 10h16v8a2 2 0 01-2 2H6a2 2 0 01-2-2v-8zm4 3a1 1 0 000 2h2a1 1 0 000-2H8z"/>
            </svg>
          </div>
          <button id="refreshBtn" class="btn" aria-label="Actualizar datos">
            <svg class="h-5 w-5" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 6V3L8 7l4 4V8a4 4 0 11-4 4H6a6 6 0 106-6z"/></svg>
            Actualizar
          </button>
        </div>
        <div class="flex gap-2">
          <button data-preset="7d"  class="btn-secondary preset">7D</button>
          <button data-preset="30d" class="btn-secondary preset">30D</button>
          <button data-preset="mtd" class="btn-secondary preset">MTD</button>
          <button data-preset="ytd" class="btn-secondary preset">YTD</button>
        </div>
      </div>
    </header>

    <!-- KPIs -->
    <section class="grid grid-cols-1 sm:grid-cols-3 gap-4">
      <!-- Ventas -->
      <article class="card">
        <div class="flex items-center justify-between">
          <span class="kpi-title">Ventas</span>
          <span class="pill">EUR</span>
        </div>
        <div id="kpiTotal" class="kpi-value mt-1 skeleton h-10 w-40" aria-live="polite"></div>
        <div class="mt-2 text-xs text-slate-500 dark:text-slate-400">Suma de <strong>Item Price</strong> en el período</div>
      </article>

      <!-- Pedidos -->
      <article class="card">
        <div class="flex items-center justify-between">
          <span class="kpi-title">Pedidos</span>
          <span class="pill">#</span>
        </div>
        <div id="kpiOrders" class="kpi-value mt-1 skeleton h-10 w-24" aria-live="polite"></div>
        <div class="mt-2 text-xs text-slate-500 dark:text-slate-400">Número de pedidos registrados</div>
      </article>

      <!-- AOV -->
      <article class="card">
        <div class="flex items-center justify-between">
          <span class="kpi-title">AOV</span>
          <span class="pill">EUR / pedido</span>
        </div>
        <div id="kpiAOV" class="kpi-value mt-1 skeleton h-10 w-28" aria-live="polite"></div>
        <div class="mt-2 text-xs text-slate-500 dark:text-slate-400">Ventas / Pedidos</div>
      </article>
    </section>

    <!-- CHART -->
    <section class="card">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-lg font-semibold text-slate-900 dark:text-white">Ventas por día</h2>
        <span id="periodChip" class="pill">—</span>
      </div>
      <div class="h-[260px]">
        <canvas id="salesChart" height="120" aria-label="Gráfico de ventas por día" role="img"></canvas>
      </div>
    </section>

    <!-- RESUMEN + PREGUNTA -->
    <section class="grid grid-cols-1 lg:grid-cols-3 gap-4">
      <!-- Resumen ejecutivo -->
      <article class="card lg:col-span-2 space-y-3">
        <div class="flex items-center justify-between">
          <h3 class="text-lg font-semibold text-slate-900 dark:text-white">Resumen ejecutivo</h3>
          <div class="flex items-center gap-2">
            <span class="pill">ChatGPT</span>
            <button id="copySummary" class="btn-ghost" title="Copiar" aria-label="Copiar resumen">
              <svg class="h-5 w-5" viewBox="0 0 24 24" fill="currentColor"><path d="M8 7a3 3 0 013-3h7a3 3 0 013 3v7a3 3 0 01-3 3h-1v1a3 3 0 01-3 3H7a3 3 0 01-3-3v-7a3 3 0 013-3h1V7z"/></svg>
            </button>
          </div>
        </div>
        <div id="summary" class="prose-md text-slate-800 dark:text-slate-100 whitespace-pre-wrap">
          <div class="skeleton h-5 w-11/12 mb-2"></div>
          <div class="skeleton h-5 w-10/12 mb-2"></div>
          <div class="skeleton h-5 w-9/12"></div>
        </div>
      </article>

      <!-- Consulta -->
      <article class="card space-y-3">
        <div class="flex items-center justify-between">
          <h3 class="text-lg font-semibold text-slate-900 dark:text-white">Consulta al analista</h3>
          <div class="text-xs text-slate-500 dark:text-slate-400">Enter para enviar · Shift+Enter salto de línea</div>
        </div>

        <!-- Sugerencias rápidas -->
        <div class="flex flex-wrap gap-2">
          <button class="btn-secondary suggestion" data-q="¿Cómo ha evolucionado el AOV en los últimos 14 días?">AOV 14D</button>
          <button class="btn-secondary suggestion" data-q="Top 5 días por ventas y explicación breve">Top días</button>
          <button class="btn-secondary suggestion" data-q="¿Hay estacionalidad semanal?">Estacionalidad</button>
        </div>

        <div class="relative">
          <textarea id="ask" class="input w-full pl-12 pr-28 min-h[80px] min-h-[80px] resize-y" placeholder="Escribe tu pregunta al analista…" aria-label="Pregunta al analista"></textarea>
          <svg class="absolute left-4 top-3.5 h-5 w-5 text-slate-400" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a7 7 0 00-7 7 7 7 0 005 6.71V18a2 2 0 002 2h2a2 2 0 002-2v-2.29A7 7 0 0019 9a7 7 0 00-7-7z"/></svg>
          <div class="absolute right-2 top-1.5 flex items-center gap-2">
            <span id="charCount" class="text-xs text-slate-400">0</span>
            <button id="askBtn" class="btn" aria-label="Enviar consulta">
              <svg class="h-5 w-5" viewBox="0 0 24 24" fill="currentColor"><path d="M4 4l16 8-16 8 4-8-4-8z"/></svg>
              Enviar
            </button>
          </div>
        </div>
        <div id="askOut" class="prose-md text-sm text-slate-800 dark:text-slate-100 min-h-[2.5rem] max-h-[260px] overflow-auto rounded-xl border border-slate-200 dark:border-slate-800 p-3 bg-white/60 dark:bg-slate-900/40" aria-live="polite"></div>
      </article>
    </section>

    <!-- Toast -->
    <div id="toast" class="fixed left-1/2 -translate-x-1/2 bottom-6 hidden">
      <div class="px-4 py-2 rounded-xl bg-slate-900 text-white shadow-lg">Hecho.</div>
    </div>
  </div>

  <script>
    const SHEET = "OrdersTable";

    // Utils
    const fmtMoney = (n) => new Intl.NumberFormat("es-ES", { style: "currency", currency: "EUR", maximumFractionDigits: 0 }).format(n || 0);
    const fmt2 = (n) => new Intl.NumberFormat("es-ES", { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(n || 0);
    const qs = (s) => document.querySelector(s);

    const elTotal  = qs("#kpiTotal");
    const elOrders = qs("#kpiOrders");
    const elAOV    = qs("#kpiAOV");
    const elSummary= qs("#summary");
    const elCopySummary = qs("#copySummary");
    const elAsk    = qs("#ask");
    const elAskBtn = qs("#askBtn");
    const elAskOut = qs("#askOut");
    const elPeriod = qs("#periodChip");
    const toast    = qs("#toast");

    // --- Fecha: Flatpickr robusto
    const toISO = (d) => new Date(d.getTime() - d.getTimezoneOffset()*60000).toISOString().slice(0,10);
    const todayISO = () => toISO(new Date());
    const offsetDate = (days) => { const t = new Date(); t.setDate(t.getDate() + days); t.setHours(0,0,0,0); return toISO(t); };

    const fp = flatpickr("#dateRange", {
      mode: "range",
      dateFormat: "Y-m-d",
      defaultDate: [offsetDate(-29), todayISO()],
      maxDate: todayISO(),
      locale: { rangeSeparator: " → ", firstDayOfWeek: 1 },
      onClose: (selectedDates, dateStr, instance) => {
        // Arregla casos con un solo día seleccionado: usamos el mismo día como fin
        if (selectedDates.length === 1) {
          const d = selectedDates[0];
          instance.setDate([toISO(d), toISO(d)], true);
        }
      }
    });

    function getRange() {
      const d = fp.selectedDates;
      // Si no hay dos fechas, usa default (30D)
      if (!d || d.length < 2) return [offsetDate(-29), todayISO()];
      const start = toISO(d[0]);
      const end = toISO(d[1]);
      return [start, end];
    }

    function setPreset(p) {
      let s, e = todayISO();
      const t = new Date(); t.setHours(0,0,0,0);
      const firstOfMonth = toISO(new Date(t.getFullYear(), t.getMonth(), 1));
      const firstOfYear  = toISO(new Date(t.getFullYear(), 0, 1));
      if (p === "7d")  s = offsetDate(-6);
      if (p === "30d") s = offsetDate(-29);
      if (p === "mtd") s = firstOfMonth;
      if (p === "ytd") s = firstOfYear;
      fp.setDate([s, e], true);
      // Estado activo visual
      document.querySelectorAll('.preset').forEach(b=>b.classList.remove('ring-2','ring-indigo-500'));
      document.querySelector(`[data-preset="${p}"]`)?.classList.add('ring-2','ring-indigo-500');
      loadAll();
    }

    document.querySelectorAll("[data-preset]").forEach(btn=>{
      btn.addEventListener("click", ()=> setPreset(btn.dataset.preset));
    });

    // --- Chart
    let chart;
    function drawChart(series) {
      const ctx = document.getElementById("salesChart").getContext("2d");
      const labels = (series||[]).map(d => d.date);
      const values = (series||[]).map(d => d.value);
      if (chart) chart.destroy();
      const gradient = ctx.createLinearGradient(0,0,0,240);
      gradient.addColorStop(0, "rgba(99,102,241,.35)");
      gradient.addColorStop(1, "rgba(99,102,241,0)");
      const isDark = matchMedia('(prefers-color-scheme: dark)').matches;

      chart = new Chart(ctx, {
        type: "line",
        data: { labels, datasets: [{ data: values, borderColor: "rgb(99,102,241)", backgroundColor: gradient, fill: true, tension: .35, borderWidth: 2, pointRadius: 0, pointHoverRadius: 3 }] },
        options: {
          plugins: { legend: { display:false }},
          interaction: { intersect:false, mode:"index" },
          maintainAspectRatio: false,
          scales: {
            x: { ticks: { color: isDark ? "#CBD5E1" : "#475569" }},
            y: { ticks: { callback: (v)=> fmtMoney(v).replace("\u00a0"," ") } }
          }
        }
      });
    }
    matchMedia('(prefers-color-scheme: dark)').addEventListener('change', ()=> loadAll());

    // Loaders
    function setKPILoading() {
      elTotal.className  = "kpi-value mt-1 skeleton h-10 w-40";
      elOrders.className = "kpi-value mt-1 skeleton h-10 w-24";
      elAOV.className    = "kpi-value mt-1 skeleton h-10 w-28";
      elSummary.innerHTML = `<div class=\"skeleton h-5 w-11/12 mb-2\"></div>
                             <div class=\"skeleton h-5 w-10/12 mb-2\"></div>
                             <div class=\"skeleton h-5 w-9/12\"></div>`;
    }
    function setKPIValues({ totalSales, orders, aov }) {
      elTotal.className  = "kpi-value mt-1";
      elOrders.className = "kpi-value mt-1";
      elAOV.className    = "kpi-value mt-1";
      elTotal.textContent  = fmtMoney(totalSales);
      elOrders.textContent = orders ?? 0;
      elAOV.textContent    = fmt2(aov);
    }

    // Data flow
    async function loadAll() {
      const [start, end] = getRange();
      elPeriod.textContent = `${start} → ${end}`;
      setKPILoading();
      toggleBtn(true);

      try {
        const mRes = await fetch(`/metrics?sheet=${encodeURIComponent(SHEET)}&start=${start}&end=${end}`);
        const m = await mRes.json();
        if (m.ok) setKPIValues(m.metrics);

        const tRes = await fetch(`/timeseries?sheet=${encodeURIComponent(SHEET)}&start=${start}&end=${end}`);
        const t = await tRes.json();
        if (t.ok) drawChart(t.timeseries || []);

        const aRes = await fetch(`/analyze-metrics`, {
          method: "POST",
          headers: {"Content-Type":"application/json"},
          body: JSON.stringify({ metrics: m.metrics, timeseries: t.timeseries })
        });
        const a = await aRes.json();
        renderMarkdown(elSummary, a.ok ? (a.summary || "") : (a.error || "No se pudo generar el informe."));
        toastFire("Datos actualizados");
      } catch(e) {
        console.error(e);
        elSummary.textContent = "Error cargando datos.";
      } finally {
        toggleBtn(false);
      }
    }

    // --- Analista
    function autosizeTextarea(el){
      el.style.height = 'auto';
      el.style.height = (el.scrollHeight) + 'px';
    }
    elAsk.addEventListener('input', ()=>{
      autosizeTextarea(elAsk);
      qs('#charCount').textContent = elAsk.value.length;
    });

    document.querySelectorAll('.suggestion').forEach(btn=>{
      btn.addEventListener('click', ()=>{ elAsk.value = btn.dataset.q; autosizeTextarea(elAsk); qs('#charCount').textContent = elAsk.value.length; elAsk.focus(); });
    });

    elCopySummary?.addEventListener('click', async ()=>{
      const text = elSummary.innerText || '';
      try { await navigator.clipboard.writeText(text); toastFire('Resumen copiado'); } catch(e){ toastFire('No se pudo copiar'); }
    });

    elAsk.addEventListener('keydown', (e)=>{
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); askAnalyst(); }
    });

    async function askAnalyst() {
      const q = (elAsk.value || "").trim();
      if (!q) return;
      toggleAsk(true);
      renderMarkdown(elAskOut, "Pensando…");
      const [start, end] = getRange();

      try {
        const mRes = await fetch(`/metrics?sheet=${encodeURIComponent(SHEET)}&start=${start}&end=${end}`);
        const m = await mRes.json();
        const tRes = await fetch(`/timeseries?sheet=${encodeURIComponent(SHEET)}&start=${start}&end=${end}`);
        const t = await tRes.json();

        const aRes = await fetch(`/analyze-metrics`, {
          method:"POST", headers:{"Content-Type":"application/json"},
          body: JSON.stringify({ metrics: m.metrics, timeseries: t.timeseries, userPrompt: q })
        });
        const a = await aRes.json();
        renderMarkdown(elAskOut, a.ok ? (a.summary || "") : (a.error || "No se pudo responder."));
      } catch(e) {
        console.error(e);
        renderMarkdown(elAskOut, "Error procesando la consulta.");
      } finally {
        toggleAsk(false);
      }
    }

    // UI helpers
    const refreshBtn = qs("#refreshBtn");
    refreshBtn.addEventListener("click", loadAll);
    elAskBtn.addEventListener("click", askAnalyst);

    function toggleBtn(disabled){ refreshBtn.disabled = disabled; }
    function toggleAsk(disabled){
      elAskBtn.disabled = disabled;
      elAskBtn.innerHTML = disabled
        ? `<svg class=\"h-5 w-5 animate-spin\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\"><circle cx=\"12\" cy=\"12\" r=\"10\" stroke-width=\"4\" opacity=\".25\"/><path d=\"M4 12a8 8 0 018-8\" stroke-width=\"4\" stroke-linecap=\"round\"/></svg> Procesando…`
        : `<svg class=\"h-5 w-5\" viewBox=\"0 0 24 24\" fill=\"currentColor\"><path d=\"M4 4l16 8-16 8 4-8-4-8z\"/></svg> Enviar`;
    }
    function toastFire(msg){ toast.querySelector("div").textContent = msg || "Hecho."; toast.classList.remove("hidden"); setTimeout(()=> toast.classList.add("hidden"), 1500); }

    function renderMarkdown(container, text){
      try { container.innerHTML = marked.parse(text || ''); }
      catch { container.textContent = text || ''; }
    }

    // Primer render
    loadAll();
  </script>
</body>
</html>
